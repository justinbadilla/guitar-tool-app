spring.application.name=guitar-app-backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/guitar_app}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:devpassword}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

gemini.api.key=${GEMINI_API_KEY}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}